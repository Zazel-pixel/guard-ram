name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # No dependencies: standard library only. The tests run the decision logic
      # on synthetic process tables; two of them start and stop a real `sleep`.
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile guard_ram.py install.py
