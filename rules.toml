# Rules shipped with guard-ram. Do not edit this file for one machine: put that machine's
# rules in ~/.config/guard-ram/rules.toml (same format). Its categories override these
# key by key, and its [[rule]] entries are tried first (see docs/rules.example.toml).
#
# How a unit (a process started by an agent, with its descendants) is classified:
#   1. a mark set with `guard-ram mark` or `guard-ram launch`;
#   2. the first [[rule]] whose pattern (a regex on the command line of the unit's root)
#      matches;
#   3. automatic classification: orphan (its agent is gone), mcp (tool server of an
#      agent), for-user (graphical window, interactive shell), task.
#
# priority      : 1 = stopped first when memory saturates, 5 = last.
# idle_min      : minutes without activity before the unit becomes "idle".
# stop_min      : minutes spent idle before it is stopped; false = never stopped for
#                 inactivity (only saturation can stop it).
# ask           : instead of stopping, ask the user in a dialog.
# cpu_pct       : % of one core above which a process counts as active.
# io_kb         : KB read or written (files, pipes, sockets) per 15 s pass.
# inherit_agent : active while its Claude Code session is in use (MCP servers).
# Every value is checked; a refused value keeps the built-in one and is logged.

# Memory limits. agents_mb caps the summed PSS of everything the agents started, except
# what was started for the user; 0 or absent means a third of physical memory.
# system_pct is the share of system memory in use that also triggers a saturation.
[limits]
agents_mb = 0
system_pct = 90

[categories.orphan]
priority = 1
idle_min = 20
stop_min = 20

[categories.mcp]
priority = 2
idle_min = 20
stop_min = 20
inherit_agent = true

[categories.task]
priority = 3
idle_min = 20
stop_min = 20

[categories.for-user]
priority = 4
idle_min = 60
stop_min = false
ask = true
cpu_pct = 10

[categories.infra]
priority = 5
idle_min = 20
stop_min = false

[categories.agent]
priority = 5
idle_min = 20
stop_min = false

[[rule]]
pattern = 'codex-code-mode-host'
category = "infra"
reason = "without it, every Codex MCP server fails"

[[rule]]
pattern = '(^|/)tmux( |$)'
category = "for-user"
reason = "tmux session (terminals, detached agent sessions)"
